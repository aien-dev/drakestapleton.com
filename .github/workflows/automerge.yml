name: automerge

# Pipeline-driven merging: any push to a non-main branch gets built, gets a PR
# opened against main if none exists, and is merged once the build passes.
# This keeps work flowing to main instead of leaving branches unmerged.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

# Serialize merges into main so concurrent branch pushes can't race.
concurrency:
  group: automerge-main
  cancel-in-progress: false

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:portfolio
      - name: Open PR and merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr create --base main --head "$BRANCH" \
              --title "Auto-merge: $BRANCH" \
              --body "Opened automatically by the automerge pipeline after a successful build of \`$BRANCH\`." \
              --json number --jq '.number')"
            echo "Opened PR #$PR_NUMBER"
          else
            echo "Found existing PR #$PR_NUMBER"
          fi
          gh pr merge "$PR_NUMBER" --merge --delete-branch
          echo "Merged PR #$PR_NUMBER into main"
