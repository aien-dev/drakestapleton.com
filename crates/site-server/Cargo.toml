[package]
name = "site-server"
version = "0.1.0"
edition = "2021"
description = "Sovereign Rust full-stack Axum server with in-memory RAM cache, live telemetry streaming, and interactive AIEN terminal for drakestapleton.com"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
chrono = "0.4.45"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
